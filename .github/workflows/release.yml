name: Build and Release

on:
  push:
    tags:
      - 'v*' # Spustí se automaticky při vytvoření tagu, např. v1.0.0

permissions:
  contents: write # Oprávnění pro vytvoření release a nahrání souborů

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: vlcr_kancelar_windows_installer.exe
          - os: ubuntu-latest
            asset_name: linux_packages
          - os: macos-latest
            asset_name: vlcr-kancelar-macos.tar.gz

    steps:
      - name: Stáhnout zdrojový kód
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow PyQt5

      - name: Sestavení aplikace (PyInstaller)
        run: |
          pyinstaller --noconsole --onedir -n vlcr-kancelar main.py

      # --- WINDOWS: Inno Setup ---
      - name: Instalace Inno Setup (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y

      - name: Kompilace instalátoru (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      # --- LINUX: Vytvoření .deb i .rpm balíčků najednou ---
      - name: Vytvoření Linux balíčků (.deb a .rpm)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Instalace nástroje fpm a rpm balíčkovače
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems rpm
          sudo gem install fpm

          # Příprava struktury pro balíčky
          mkdir -p pkg_root/opt/vlcr-kancelar
          mkdir -p pkg_root/usr/share/applications
          mkdir -p pkg_root/usr/share/pixmaps

          # Zkopírování aplikace
          cp -r dist/vlcr-kancelar/* pkg_root/opt/vlcr-kancelar/

          # Vytvoření .desktop zástupce pro systémové menu
          cat << 'EOF' > pkg_root/usr/share/applications/vlcr-kancelar.desktop
          [Desktop Entry]
          Name=VLČR Kancelář
          Comment=Kancelářský balík
          Exec=/opt/vlcr-kancelar/vlcr-kancelar
          Icon=vlcr-kancelar
          Type=Application
          Categories=Office;
          EOF

          # Přidání ikony, pokud existuje
          if [ -f "images/VLCR_logo.png" ]; then
            cp images/VLCR_logo.png pkg_root/usr/share/pixmaps/vlcr-kancelar.png
          fi

          # 1. Sestavení .deb balíčku (pro Ubuntu/Debian)
          fpm -s dir -t deb \
            -n vlcr-kancelar \
            -v 1.0.0 \
            --architecture amd64 \
            --category utils \
            --maintainer "Vzdělaný lid ČR <info@vlcr.cz>" \
            --description "Kancelářský balík VLČR Kancelář" \
            pkg_root/=/

          # 2. Sestavení .rpm balíčku (pro openSUSE, Fedora, RHEL)
          fpm -s dir -t rpm \
            -n vlcr-kancelar \
            -v 1.0.0 \
            --architecture x86_64 \
            --category Office \
            --maintainer "Vzdělaný lid ČR <info@vlcr.cz>" \
            --description "Kancelářský balík VLČR Kancelář" \
            pkg_root/=/

      # --- MACOS ---
      - name: Zabalení pro macOS
        if: matrix.os == 'macos-latest'
        run: |
          tar -czvf vlcr-kancelar-macos.tar.gz -C dist .

      # --- NAHRÁNÍ VŠECH SOUBORŮ DO RELEASES ---
      - name: Nahrát soubory do GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vlcr_kancelar_windows_installer.exe
            vlcr-kancelar_1.0.0_amd64.deb
            vlcr-kancelar-1.0.0-1.x86_64.rpm
            vlcr-kancelar-macos.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}