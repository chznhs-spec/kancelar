name: Build and Release

on:
  push:
    tags:
      - 'v*' # Spustí se automaticky při vytvoření tagu, např. v1.0.0

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            app_name: vlcr-kancelar-windows.zip
          - os: macos-latest
            app_name: vlcr-kancelar-macos.zip
          - os: ubuntu-latest
            app_name: vlcr-kancelar-linux.tar.gz

    steps:
      - name: Stáhnout zdrojový kód
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow PyQt5

      - name: Sestavení aplikace (PyInstaller)
        run: |
          pyinstaller --noconsole --onedir main.py

      - name: Zabalení pro Windows
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path dist/* -DestinationPath vlcr-kancelar-windows.zip

      - name: Zabalení pro Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czvf vlcr-kancelar-linux.tar.gz -C dist .

      - name: Zabalení pro macOS
        if: matrix.os == 'macos-latest'
        run: |
          tar -czvf vlcr-kancelar-macos.tar.gz -C dist .

      - name: Nahrát soubory do GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vlcr-kancelar-windows.zip
            vlcr-kancelar-macos.zip
            vlcr-kancelar-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}