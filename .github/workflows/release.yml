name: Build and Release

# Spustí se po nahrání tagu ve tvaru v1.2.3 (git tag v1.2.3 && git push origin v1.2.3).
# Ručně (Actions -> Run workflow) se jen sestaví a výsledky jsou ke stažení jako "artifacts",
# release se v tom případě nevytváří.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ===========================================================================
  # WINDOWS: jeden soubor vlcr_kancelar_setup.exe, který v sobě nese celou sadu
  # ===========================================================================
  windows:
    name: Windows instalátor
    runs-on: windows-latest
    steps:
      - name: Stáhnout zdrojový kód
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Určit verzi z tagu a zapsat ji do zdrojových kódů
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          for f in main.py pisar.py pocitar.py prezentar.py pruzkumnik.py vlcr_kancelar_setup.py; do
            if [ -f "$f" ]; then sed -i -E "s/^APP_VERSION = .*/APP_VERSION = \"$V\"/" "$f"; fi
          done
          echo "Verze: $V"

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.3" pillow PyQt5

      - name: Vytvořit ikony .ico z PNG
        shell: bash
        run: |
          python - <<'PY'
          import os
          from PIL import Image
          os.makedirs("build_icons", exist_ok=True)
          SRC = {
              "vlcr-kancelar": "images/VLCR_logo.png",
              "pisar": "loga/pisar.png",
              "pocitar": "loga/pocitar.png",
              "prezentar": "loga/prezenter.png",
              "pruzkumnik": "loga/pruzkumnik_souboru.png",
          }
          for name, src in SRC.items():
              if not os.path.isfile(src):
                  print("chybí ikona", src)
                  continue
              im = Image.open(src).convert("RGBA")
              side = max(im.size)
              canvas = Image.new("RGBA", (side, side), (0, 0, 0, 0))
              canvas.paste(im, ((side - im.width) // 2, (side - im.height) // 2))
              canvas.save(f"build_icons/{name}.ico", sizes=[(s, s) for s in (256, 128, 64, 48, 32, 16)])
              print("ikona", name)
          PY

      - name: Sestavit celou sadu (jeden společný adresář)
        shell: bash
        run: |
          pyinstaller --noconfirm --clean vlcr_suite.spec
          for exe in vlcr-kancelar pisar pocitar prezentar pruzkumnik; do
            test -f "dist/vlcr-kancelar/$exe.exe" || { echo "CHYBÍ $exe.exe"; exit 1; }
          done
          ls -la dist/vlcr-kancelar

      - name: Zabalit sadu do payload.zip
        shell: bash
        run: |
          python - <<'PY'
          import os, zipfile
          src = "dist/vlcr-kancelar"
          with zipfile.ZipFile("payload.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for root, _, files in os.walk(src):
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, src).replace(os.sep, "/"))
          print("payload.zip:", round(os.path.getsize("payload.zip") / 1048576, 1), "MB")
          PY

      - name: Sestavit instalátor vlcr_kancelar_setup.exe
        shell: bash
        run: |
          ICON=""
          if [ -f build_icons/vlcr-kancelar.ico ]; then ICON="--icon build_icons/vlcr-kancelar.ico"; fi
          pyinstaller --noconfirm --clean --onefile --noconsole --uac-admin \
            -n vlcr_kancelar_setup $ICON \
            --add-data "payload.zip;." \
            --add-data "images;images" \
            vlcr_kancelar_setup.py
          test -f dist/vlcr_kancelar_setup.exe

      - name: Uložit instalátor
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/vlcr_kancelar_setup.exe
          if-no-files-found: error

  # ===========================================================================
  # openSUSE: balíček .rpm (instalace: sudo zypper install ./vlcr-kancelar-*.rpm)
  # Sestavuje se na Ubuntu 22.04 (starší glibc = běží i na novějších openSUSE).
  # ===========================================================================
  rpm:
    name: openSUSE .rpm
    runs-on: ubuntu-22.04
    steps:
      - name: Stáhnout zdrojový kód
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Určit verzi z tagu a zapsat ji do zdrojových kódů
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          for f in main.py pisar.py pocitar.py prezentar.py pruzkumnik.py; do
            if [ -f "$f" ]; then sed -i -E "s/^APP_VERSION = .*/APP_VERSION = \"$V\"/" "$f"; fi
          done
          echo "Verze: $V"

      - name: Systémové balíčky (rpmbuild a knihovny pro Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libgl1 libxkbcommon0 libglib2.0-0 libfontconfig1 libdbus-1-3

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.3" pillow PyQt5

      - name: Sestavit celou sadu (jeden společný adresář)
        run: |
          pyinstaller --noconfirm --clean vlcr_suite.spec
          for exe in vlcr-kancelar pisar pocitar prezentar pruzkumnik; do
            test -x "dist/vlcr-kancelar/$exe" || { echo "CHYBÍ $exe"; exit 1; }
          done
          dist/vlcr-kancelar/pocitar --version
          dist/vlcr-kancelar/pruzkumnik --version

      - name: Uložit sestavenou sadu pro .deb
        run: tar -cf linux-bundle.tar -C dist vlcr-kancelar

      - name: Předat sadu dalším jobům
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: linux-bundle.tar
          retention-days: 1
          if-no-files-found: error

      - name: Sestavit .rpm
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          # RPM nesmí mít ve verzi pomlčku: pre-release (1.2.0-beta) se zapisuje s tildou (1.2.0~beta).
          # Záměrně přes tr - zápis ${VERSION//-/~} by bash rozvinul na domovský adresář.
          RPM_VERSION="$(printf '%s' "$VERSION" | tr '-' '~')"
          mkdir -p rpmbuild/BUILD rpmbuild/RPMS rpmbuild/SOURCES rpmbuild/SPECS rpmbuild/SRPMS icons

          cp_icon() { if [ -f "$1" ]; then cp "$1" "icons/$2"; else cp images/VLCR_logo.png "icons/$2"; fi; }
          cp_icon images/VLCR_logo.png vlcr-kancelar.png
          cp_icon loga/pisar.png vlcr-pisar.png
          cp_icon loga/pocitar.png vlcr-pocitar.png
          cp_icon loga/prezenter.png vlcr-prezentar.png
          cp_icon loga/pruzkumnik_souboru.png vlcr-pruzkumnik.png

          rpmbuild -bb packaging/vlcr-kancelar.spec \
            --target x86_64-linux \
            --define "_topdir $PWD/rpmbuild" \
            --define "app_version $RPM_VERSION" \
            --define "stage_dir $PWD/dist/vlcr-kancelar" \
            --define "icons_dir $PWD/icons" \
            --define "_binary_payload w6.xzdio"

          ls -la rpmbuild/RPMS/x86_64/
          rpm -qip rpmbuild/RPMS/x86_64/*.rpm
          rpm -qlp rpmbuild/RPMS/x86_64/*.rpm | head -40

      - name: Uložit .rpm
        uses: actions/upload-artifact@v4
        with:
          name: opensuse-rpm
          path: rpmbuild/RPMS/x86_64/*.rpm
          if-no-files-found: error

  # Kontrola, že se balíček dá opravdu nainstalovat i odinstalovat na openSUSE
  # (neblokuje vydání - jen ukáže problém v logu).
  verify-rpm:
    name: Kontrola .rpm na openSUSE
    needs: rpm
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
      - name: Stáhnout .rpm
        uses: actions/download-artifact@v4
        with:
          name: opensuse-rpm
          path: rpm

      - name: Instalace a odinstalace přes zypper
        run: |
          set -eu
          zypper --non-interactive refresh
          zypper --non-interactive --no-gpg-checks install --allow-unsigned-rpm --no-recommends ./rpm/*.rpm
          rpm -qi vlcr-kancelar
          test -x /opt/vlcr-kancelar/vlcr-kancelar
          test -x /opt/vlcr-kancelar/pocitar
          ls /usr/share/applications/ | grep vlcr
          zypper --non-interactive remove vlcr-kancelar
          test ! -e /opt/vlcr-kancelar

  # ===========================================================================
  # Debian / Ubuntu: balíček .deb (instalace: sudo apt install ./vlcr-kancelar_*.deb)
  # Používá stejně sestavenou sadu jako .rpm (Ubuntu 22.04+, Debian 12+).
  # ===========================================================================
  deb:
    name: Debian/Ubuntu .deb
    needs: rpm
    runs-on: ubuntu-22.04
    steps:
      - name: Stáhnout zdrojový kód
        uses: actions/checkout@v4

      - name: Stáhnout sestavenou sadu
        uses: actions/download-artifact@v4
        with:
          name: linux-bundle

      - name: Sestavit .deb
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          DEB_VERSION="$(printf '%s' "$V" | tr '-' '~')"

          mkdir -p dist && tar -xf linux-bundle.tar -C dist
          R=debroot
          mkdir -p "$R/DEBIAN" "$R/opt" "$R/usr/bin" "$R/usr/share/applications" "$R/usr/share/pixmaps"
          cp -a dist/vlcr-kancelar "$R/opt/vlcr-kancelar"

          ln -s /opt/vlcr-kancelar/vlcr-kancelar "$R/usr/bin/vlcr-kancelar"
          for app in pisar pocitar prezentar pruzkumnik; do
            ln -s "/opt/vlcr-kancelar/$app" "$R/usr/bin/vlcr-$app"
          done

          cp_icon() { if [ -f "$1" ]; then cp "$1" "$R/usr/share/pixmaps/$2"; else cp images/VLCR_logo.png "$R/usr/share/pixmaps/$2"; fi; }
          cp_icon images/VLCR_logo.png vlcr-kancelar.png
          cp_icon loga/pisar.png vlcr-pisar.png
          cp_icon loga/pocitar.png vlcr-pocitar.png
          cp_icon loga/prezenter.png vlcr-prezentar.png
          cp_icon loga/pruzkumnik_souboru.png vlcr-pruzkumnik.png

          mk_desktop() {
            cat > "$R/usr/share/applications/$1.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=$2
          Comment=$3
          Exec=$4
          Icon=$1
          Terminal=false
          Categories=$5
          EOF
          }
          mk_desktop vlcr-kancelar   "VLČR Kancelář"      "Hlavní rozcestník sady VLČR Kancelář" /opt/vlcr-kancelar/vlcr-kancelar   "Office;"
          mk_desktop vlcr-pisar      "Písař"              "Textový editor"                       /opt/vlcr-kancelar/pisar           "Office;WordProcessor;"
          mk_desktop vlcr-pocitar    "Počítář"            "Tabulkový procesor"                   /opt/vlcr-kancelar/pocitar         "Office;Spreadsheet;"
          mk_desktop vlcr-prezentar  "Prezentář"          "Editor prezentací"                    /opt/vlcr-kancelar/prezentar       "Office;Presentation;"
          mk_desktop vlcr-pruzkumnik "Průzkumník souborů" "Správa souborů .vlcr"                 /opt/vlcr-kancelar/pruzkumnik      "System;FileManager;"

          SIZE_KB="$(du -sk "$R/opt" | cut -f1)"
          cat > "$R/DEBIAN/control" <<EOF
          Package: vlcr-kancelar
          Version: $DEB_VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Vzdělaný lid ČR <info@vlcr.cz>
          Installed-Size: $SIZE_KB
          Depends: libc6 (>= 2.35)
          Recommends: libgl1, libxkbcommon-x11-0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-render-util0, libxcb-xinerama0, libxcb-xkb1, libxcb-randr0, libxcb-shape0, libfontconfig1, libdbus-1-3
          Description: Kancelářský balík VLČR Kancelář
           Písař (textový editor), Počítář (tabulky), Prezentář (prezentace)
           a Průzkumník souborů pro vlastní formát .vlcr.
          EOF

          cat > "$R/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          update-desktop-database -q /usr/share/applications >/dev/null 2>&1 || true
          exit 0
          EOF
          cp "$R/DEBIAN/postinst" "$R/DEBIAN/postrm"
          chmod 0755 "$R/DEBIAN/postinst" "$R/DEBIAN/postrm"
          find "$R" -type d -exec chmod 0755 {} +

          dpkg-deb --build --root-owner-group "$R" "vlcr-kancelar_${DEB_VERSION}_amd64.deb"
          dpkg-deb -I vlcr-kancelar_*_amd64.deb
          dpkg-deb -c vlcr-kancelar_*_amd64.deb | head -30

      - name: Uložit .deb
        uses: actions/upload-artifact@v4
        with:
          name: debian-deb
          path: vlcr-kancelar_*_amd64.deb
          if-no-files-found: error

  # Kontrola instalace a odinstalace na čistém Debianu (neblokuje vydání)
  verify-deb:
    name: Kontrola .deb na Debianu
    needs: deb
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: Stáhnout .deb
        uses: actions/download-artifact@v4
        with:
          name: debian-deb
          path: deb

      - name: Instalace a odinstalace přes apt
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends ./deb/*.deb
          dpkg -s vlcr-kancelar
          test -x /opt/vlcr-kancelar/vlcr-kancelar
          test -x /opt/vlcr-kancelar/pocitar
          ls /usr/share/applications | grep vlcr
          apt-get remove -y vlcr-kancelar
          test ! -e /opt/vlcr-kancelar

  # ===========================================================================
  # macOS: obraz disku .dmg s aplikací (přetáhnout do Aplikací)
  # Dvě sestavení: Apple Silicon (arm64) a Intel (x86_64) - každý typ Macu potřebuje své.
  # ===========================================================================
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Stáhnout zdrojový kód
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Určit verzi z tagu a zapsat ji do zdrojových kódů
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # přenositelný zápis (sed -i se na macOS chová jinak než na Linuxu)
          for f in main.py pisar.py pocitar.py prezentar.py pruzkumnik.py; do
            if [ -f "$f" ]; then
              sed -E "s/^APP_VERSION = .*/APP_VERSION = \"$V\"/" "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            fi
          done
          echo "Verze: $V"

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.3" pillow PyQt5

      - name: Vytvořit ikonu .icns z PNG
        shell: bash
        run: |
          python - <<'PY'
          import os
          from PIL import Image
          os.makedirs("build_icons", exist_ok=True)
          src = "images/VLCR_logo.png"
          if os.path.isfile(src):
              im = Image.open(src).convert("RGBA")
              side = max(im.size)
              canvas = Image.new("RGBA", (side, side), (0, 0, 0, 0))
              canvas.paste(im, ((side - im.width) // 2, (side - im.height) // 2))
              canvas.resize((1024, 1024), Image.LANCZOS).save("build_icons/vlcr-kancelar.icns")
              print("ikona .icns vytvořena")
          else:
              print("chybí", src)
          PY

      - name: Sestavit aplikaci (.app)
        shell: bash
        env:
          VLCR_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pyinstaller --noconfirm --clean vlcr_suite.spec
          APP="dist/VLCR Kancelar.app"
          test -d "$APP" || { echo "CHYBÍ $APP"; ls -la dist; exit 1; }
          for exe in vlcr-kancelar pisar pocitar prezentar pruzkumnik; do
            if [ ! -f "$APP/Contents/MacOS/$exe" ]; then
              echo "CHYBÍ $exe v $APP/Contents/MacOS"
              find "$APP" -maxdepth 3 | head -60
              exit 1
            fi
          done
          "$APP/Contents/MacOS/pocitar" --version

      - name: Vytvořit .dmg
        shell: bash
        run: |
          mkdir -p dmgroot
          cp -R "dist/VLCR Kancelar.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          cat > dmgroot/JAK_SPUSTIT.txt <<'TXT'
          1) Přetáhněte "VLCR Kancelar" do složky Aplikace.
          2) Při prvním spuštění klepněte na aplikaci pravým tlačítkem a zvolte Otevřít
             (aplikace zatím není podepsána u Applu, proto macOS jinak zobrazí varování).
          TXT
          hdiutil create -volname "VLCR Kancelar" -srcfolder dmgroot -ov -format UDZO \
            "vlcr_kancelar_macos_${{ matrix.arch }}.dmg"
          ls -la *.dmg

      - name: Uložit .dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: vlcr_kancelar_macos_${{ matrix.arch }}.dmg
          if-no-files-found: error

  # ===========================================================================
  # Vydání na GitHubu: jedno vytvoření releasu se všemi soubory
  # ===========================================================================
  release:
    name: Vytvořit GitHub release
    # Windows, openSUSE (.rpm) a Debian/Ubuntu (.deb) jsou povinné; případné selhání macOS vydání neblokuje
    # (soubory pro macOS se přidají jen tehdy, když se sestavení povedlo).
    needs: [windows, rpm, deb, macos]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && needs.rpm.result == 'success' && needs.deb.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout sestavené soubory
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Kontrolní součty
        run: |
          cd artifacts
          rm -f linux-bundle.tar   # pomocný soubor mezi joby, do vydání nepatří
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Vydat release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}