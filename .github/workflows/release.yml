name: Build and Release

on:
  push:
    tags:
      - 'v*' # Spustí se automaticky při vytvoření tagu, např. v1.0.0

permissions:
  contents: write # Oprávnění pro vytvoření release a nahrání souborů

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: vlcr_kancelar_windows_installer.exe
          - os: ubuntu-latest
            asset_name: vlcr-kancelar-linux.tar.gz
          - os: macos-latest
            asset_name: vlcr-kancelar-macos.tar.gz

    steps:
      - name: Stáhnout zdrojový kód
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow PyQt5

      # --- SESTAVENÍ APLIKACE S OBRÁZKY ---
      - name: Sestavení aplikace (PyInstaller)
        run: |
          pyinstaller --noconsole --onedir -n vlcr-kancelar --add-data "images${{ matrix.os == 'windows-latest' && ';' || ':' }}images" main.py

      # --- DOPLNĚNÍ MODULŮ APPS DO DIST STRUKTURY ---
      - name: Příprava složky apps
        run: |
          mkdir -p dist/vlcr-kancelar/apps
          if [ -d "apps" ]; then
            cp -r apps/* dist/vlcr-kancelar/apps/
          fi

      # --- WINDOWS: Inno Setup ---
      - name: Instalace Inno Setup (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y

      - name: Kompilace instalátoru (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      # --- LINUX: Vytvoření stabilního archivu se všemi moduly a obrázky ---
      - name: Zabalení pro Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Vytvoření .desktop zástupce pro systémové menu přímo v zabalené složce
          cat << 'EOF' > dist/vlcr-kancelar/vlcr-kancelar.desktop
          [Desktop Entry]
          Name=VLČR Kancelář
          Comment=Kancelářský balík
          Exec=./vlcr-kancelar
          Icon=vlcr-kancelar
          Type=Application
          Categories=Office;
          EOF

          # Zabalení celé složky dist do čistého tar.gz archivu
          tar -czvf vlcr-kancelar-linux.tar.gz -C dist vlcr-kancelar

      # --- MACOS: Zabalení pro macOS ---
      - name: Zabalení pro macOS
        if: matrix.os == 'macos-latest'
        run: |
          tar -czvf vlcr-kancelar-macos.tar.gz -C dist .

      # --- NAHRÁNÍ SOUBORŮ DO GITHUB RELEASES ---
      - name: Nahrát soubory do GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vlcr_kancelar_windows_installer.exe
            vlcr-kancelar-linux.tar.gz
            vlcr-kancelar-macos.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}