name: Build and Release

on:
  push:
    tags:
      - 'v*' # Spustí se automaticky při vytvoření tagu, např. v1.0.0

permissions:
  contents: write # Nutné oprávnění pro zápis a vytvoření GitHub Release

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: vlcr_kancelar_windows_installer.exe
          - os: ubuntu-latest
            asset_name: vlcr-kancelar_1.0.0_amd64.deb
          - os: macos-latest
            asset_name: vlcr-kancelar-macos.tar.gz

    steps:
      - name: Stáhnout zdrojový kód
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow PyQt5

      # Použijeme parametr -n vlcr-kancelar, aby se výstup jmenoval čistě
      - name: Sestavení aplikace (PyInstaller)
        run: |
          pyinstaller --noconsole --onedir -n vlcr-kancelar main.py

      # --- WINDOWS: Vytvoření profesionálního setup.exe přes Inno Setup ---
      - name: Instalace Inno Setup (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y

      - name: Kompilace instalátoru (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      # --- LINUX: Vytvoření plnohodnotného nativního .deb balíčku ---
      - name: Vytvoření .deb balíčku (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p deb_package/DEBIAN
          mkdir -p deb_package/opt/vlcr-kancelar
          mkdir -p deb_package/usr/share/applications
          mkdir -p deb_package/usr/share/pixmaps

          # Zkopírování zkompilované aplikace do systémové adresy /opt/vlcr-kancelar
          cp -r dist/vlcr-kancelar/* deb_package/opt/vlcr-kancelar/

          # Vytvoření konfiguračního souboru control pro správce balíčků
          cat << 'EOF' > deb_package/DEBIAN/control
          Package: vlcr-kancelar
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Vzdělaný lid ČR <info@vlcr.cz>
          Description: Kancelářský balík VLČR Kancelář
           Zahrnuje Hlavní rozcestník, Průzkumník, Písař a Prezentář.
          EOF

          # Vytvoření zástupce, aby se aplikace objevila v systémovém menu Linuxu
          cat << 'EOF' > deb_package/usr/share/applications/vlcr-kancelar.desktop
          [Desktop Entry]
          Name=VLČR Kancelář
          Comment=Kancelářský balík
          Exec=/opt/vlcr-kancelar/vlcr-kancelar
          Icon=vlcr-kancelar
          Type=Application
          Categories=Office;
          EOF

          # Přidání ikony do menu (pokud existuje)
          if [ -f "images/VLCR_logo.png" ]; then
            cp images/VLCR_logo.png deb_package/usr/share/pixmaps/vlcr-kancelar.png
          fi

          # Sestavení finálního .deb souboru
          dpkg-deb --build deb_package vlcr-kancelar_1.0.0_amd64.deb

      # --- MACOS: Zabalení pro macOS ---
      - name: Zabalení pro macOS
        if: matrix.os == 'macos-latest'
        run: |
          tar -czvf vlcr-kancelar-macos.tar.gz -C dist .

      # --- NAHRÁNÍ VŠECH VÝSTUPŮ DO GITHUB RELEASES ---
      - name: Nahrát soubory do GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vlcr_kancelar_windows_installer.exe
            vlcr-kancelar_1.0.0_amd64.deb
            vlcr-kancelar-macos.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}