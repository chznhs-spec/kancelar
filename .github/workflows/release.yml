name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: vlcr_kancelar_windows_installer.exe
          - os: ubuntu-latest
            asset_name: linux_packages
          - os: macos-latest
            asset_name: vlcr-kancelar-macos.tar.gz

    steps:
      - name: Stáhnout zdrojový kód
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow PyQt5

      # --- 1. SESTAVENÍ HLAVNÍ APLIKACE A MODULŮ (V BASHI) ---
      - name: Sestavení hlavní aplikace (PyInstaller)
        shell: bash
        run: |
          pyinstaller --noconsole --onedir -n vlcr-kancelar --add-data "images${{ matrix.os == 'windows-latest' && ';' || ':' }}images" main.py

      - name: Sestavení a přibalení vedlejších aplikací (Písař, Počítáč, Prezentář, Průzkumník)
        shell: bash
        run: |
          mkdir -p dist/vlcr-kancelar/apps

          pyinstaller --noconsole --onedir -n pisar pisar.py
          pyinstaller --noconsole --onedir -n pocitar pocitar.py
          pyinstaller --noconsole --onedir -n prezentar prezentar.py
          pyinstaller --noconsole --onedir -n pruzkumnik pruzkumnik.py

          # Univerzální zkopírování bez ohledu na to, zda jde o adresář nebo soubor s .exe příponou
          for app in pisar pocitar prezentar pruzkumnik; do
            if [ -d "dist/$app" ]; then
              cp -r dist/$app/* dist/vlcr-kancelar/apps/
            elif [ -f "dist/$app" ]; then
              cp dist/$app dist/vlcr-kancelar/apps/
            elif [ -f "dist/$app.exe" ]; then
              cp dist/$app.exe dist/vlcr-kancelar/apps/
            fi
          done

      # --- 2. WINDOWS: Inno Setup ---
      - name: Instalace Inno Setup (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y

      - name: Kompilace instalátoru (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          }
          & $iscc setup.iss

      # --- 3. LINUX: Vytvoření .deb a .rpm balíčků ---
      - name: Vytvoření Linux balíčků (.deb a .rpm)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems rpm
          sudo gem install fpm

          mkdir -p pkg_root/opt/vlcr-kancelar
          mkdir -p pkg_root/usr/share/applications
          mkdir -p pkg_root/usr/share/pixmaps

          cp -r dist/vlcr-kancelar/* pkg_root/opt/vlcr-kancelar/

          cat << 'EOF' > pkg_root/usr/share/applications/vlcr-kancelar.desktop
          [Desktop Entry]
          Name=VLČR Kancelář
          Comment=Kancelářský balík
          Exec=/opt/vlcr-kancelar/vlcr-kancelar
          Icon=vlcr-kancelar
          Type=Application
          Categories=Office;
          EOF

          if [ -f "images/VLCR_logo.png" ]; then
            cp images/VLCR_logo.png pkg_root/usr/share/pixmaps/vlcr-kancelar.png
          fi

          fpm -s dir -t deb \
            -n vlcr-kancelar \
            -v 1.1.0 \
            --architecture amd64 \
            --category utils \
            --maintainer "Vzdělaný lid ČR <info@vlcr.cz>" \
            --description "Kancelářský balík VLČR Kancelář" \
            pkg_root/=/

          fpm -s dir -t rpm \
            -n vlcr-kancelar \
            -v 1.1.0 \
            --architecture x86_64 \
            --rpm-digest sha256 \
            --category Office \
            --maintainer "Vzdělaný lid ČR <info@vlcr.cz>" \
            --description "Kancelářský balík VLČR Kancelář" \
            pkg_root/=/

      # --- 4. MACOS ---
      - name: Zabalení pro macOS
        if: matrix.os == 'macos-latest'
        run: |
          tar -czvf vlcr-kancelar-macos.tar.gz -C dist .

      # --- 5. NAHRÁNÍ VÝSTUPŮ DO GITHUB RELEASES ---
      - name: Nahrát Windows instalátor
        uses: softprops/action-gh-release@v2
        if: matrix.os == 'windows-latest'
        with:
          files: vlcr_kancelar_windows_installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Nahrát Linux balíčky
        uses: softprops/action-gh-release@v2
        if: matrix.os == 'ubuntu-latest'
        with:
          files: |
            vlcr-kancelar_1.1.0_amd64.deb
            vlcr-kancelar_1.1.0-1.x86_64.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Nahrát macOS archiv
        uses: softprops/action-gh-release@v2
        if: matrix.os == 'macos-latest'
        with:
          files: vlcr-kancelar-macos.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}